name: Run Unit Tests

on:
  push:
    branches:
      - main
      - branchAutoTest
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ automake autoconf

      - name: Generate Build System
        run: |
          autoreconf --install
          ./configure

      - name: Build Project and Unit Test
        run: |
          make
          make check
